apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "irrigator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irrigator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "irrigator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "irrigator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "irrigator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: irrigator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        args:
        - --api-addr=:{{ .Values.ports.api }}
        - --probe-addr=:{{ .Values.ports.probe }}
        - --metrics-addr=:{{ .Values.ports.metrics }}
        - --leader-election={{ .Values.controller.leaderElection }}
        {{- if .Values.controller.leaderElectionNamespace }}
        - --leader-election-namespace={{ .Values.controller.leaderElectionNamespace }}
        {{- end }}
        - --valve-controller-url={{ .Values.valveController.url }}
        - --tls-cert=/tls/tls.crt
        - --tls-key=/tls/tls.key
        - --client-ca=/tls-client-ca/ca.crt
        - --valve-client-cert=/valve-client-tls/tls.crt
        - --valve-client-key=/valve-client-tls/tls.key
        - --valve-server-ca=/valve-server-ca/ca.crt
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: {{ .Values.ports.api }}
          name: api
          protocol: TCP
        - containerPort: {{ .Values.ports.metrics }}
          name: metrics
          protocol: TCP
        - containerPort: {{ .Values.ports.probe }}
          name: probe
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: probe
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: server-tls
          mountPath: /tls
        - name: client-ca
          mountPath: /tls-client-ca
        - name: valve-client-tls
          mountPath: /valve-client-tls
        - name: valve-server-ca
          mountPath: /valve-server-ca
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: server-tls
        secret:
          secretName: {{ include "irrigator.tlsSecretName" . }}
      - name: client-ca
        secret:
          secretName: {{ required "tls.clientCASecretName is required" .Values.tls.clientCASecretName }}
      - name: valve-client-tls
        secret:
          secretName: {{ required "valveController.clientCertSecretName is required" .Values.valveController.clientCertSecretName }}
      - name: valve-server-ca
        secret:
          secretName: {{ required "valveController.serverCASecretName is required" .Values.valveController.serverCASecretName }}

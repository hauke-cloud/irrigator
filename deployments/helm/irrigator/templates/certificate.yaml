{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "irrigator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irrigator.labels" . | nindent 4 }}
spec:
  secretName: {{ include "irrigator.tlsSecretName" . }}
  issuerRef:
    name: {{ .Values.certManager.issuerRef.name }}
    kind: {{ .Values.certManager.issuerRef.kind | default "ClusterIssuer" }}
  dnsNames:
    {{- toYaml .Values.tls.dnsNames | nindent 4 }}
  usages:
    - server auth
    - client auth
  duration: 8760h
  renewBefore: 720h
{{- end }}

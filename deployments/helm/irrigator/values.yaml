replicaCount: 1

image:
  repository: ghcr.io/hauke-cloud/irrigator
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# TLS configuration for the irrigator REST API server.
# See helm-charts.md for the full conventions.
tls:
  # Pre-provisioned Secret containing tls.crt and tls.key.
  # When set, this is used directly and no Certificate CR is created.
  existingSecret: ""
  # DNS names included in the server certificate (used by cert-manager).
  dnsNames:
    - irrigator
    - irrigator.iot.svc.cluster.local
  # Name of the Secret that contains ca.crt used to verify API client certificates.
  clientCASecretName: ""

certManager:
  enabled: false
  issuerRef:
    name: cluster-issuer
    kind: ClusterIssuer

# Configuration for calling the valve-controller REST API.
valveController:
  url: "https://valve-controller.mqtt.svc.cluster.local:8443"
  # Secret containing tls.crt and tls.key — the irrigator's client certificate.
  clientCertSecretName: ""
  # Secret containing ca.crt — the valve-controller's server CA.
  serverCASecretName: ""

controller:
  leaderElection: true
  leaderElectionNamespace: ""

ports:
  api: 8443
  metrics: 8080
  probe: 8081

service:
  type: ClusterIP
  port: 8443

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

crds:
  install: true

serviceMonitor:
  enabled: false
  namespace: "" # defaults to Release.Namespace
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels added to the ServiceMonitor metadata (e.g. for serviceMonitorSelector matching).
  additionalLabels: {}

prometheusRules:
  enabled: false
  namespace: "" # defaults to Release.Namespace
  # Extra labels added to the PrometheusRule metadata (e.g. for ruleSelector matching).
  additionalLabels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

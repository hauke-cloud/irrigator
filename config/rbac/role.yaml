apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: irrigator-role
rules:
- apiGroups: [iot.hauke.cloud]
  resources: [irrigationschedules]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [iot.hauke.cloud]
  resources: [irrigationschedules/status]
  verbs: [get, update, patch]
- apiGroups: [iot.hauke.cloud]
  resources: [irrigationschedules/finalizers]
  verbs: [update]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
